name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Conventions
        run: scripts/check-conventions.sh

      - name: Unit tests
        run: ./gradlew :core:game:test testDebugUnitTest --stacktrace

      # Every class needs 90% of its lines covered by the unit tests (KoverConventionPlugin). On failure, the report
      # (build/reports/kover/htmlUnit) is in the reports artifact.
      - name: Coverage
        run: ./gradlew :koverVerifyUnit :koverHtmlReportUnit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
